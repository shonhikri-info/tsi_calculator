<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>בדיקת Firestore</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 50px auto;
      padding: 20px;
      background: #1a1a1a;
      color: #fff;
    }
    h1 { color: #FFD700; }
    .status {
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
      background: rgba(255,255,255,0.1);
    }
    .success { border-right: 5px solid #28a745; }
    .error { border-right: 5px solid #dc3545; }
    .info { border-right: 5px solid #17a2b8; }
    pre {
      background: #000;
      padding: 15px;
      border-radius: 5px;
      overflow-x: auto;
      direction: ltr;
      text-align: left;
    }
    button {
      background: #FFD700;
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 10px 5px;
    }
    button:hover { background: #FFC700; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    th, td {
      padding: 12px;
      border: 1px solid #444;
      text-align: right;
    }
    th {
      background: #333;
      font-weight: bold;
      color: #FFD700;
    }
    tr:nth-child(even) { background: rgba(255,255,255,0.05); }
  </style>
</head>
<body>
  <h1>🔍 בדיקת נתוני Firestore</h1>

  <div id="status" class="status info">
    <strong>מצב:</strong> לחץ על הכפתור לבדיקה
  </div>

  <button onclick="checkFirestore()">בדוק נתונים</button>
  <button onclick="location.reload()">רענן דף</button>

  <div id="results"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyAYmL6Fm-8FaCw1LNV4yUDx1tCzPy_tVcM",
      authDomain: "tsi-investment-app-61e75.firebaseapp.com",
      projectId: "tsi-investment-app-61e75",
      storageBucket: "tsi-investment-app-61e75.firebasestorage.app",
      messagingSenderId: "160771557680",
      appId: "1:160771557680:web:b32f413dc0e4ee58e260f5"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.checkFirestore = async function() {
      const statusDiv = document.getElementById('status');
      const resultsDiv = document.getElementById('results');

      statusDiv.className = 'status info';
      statusDiv.innerHTML = '<strong>מצב:</strong> טוען נתונים...';
      resultsDiv.innerHTML = '';

      try {
        console.log('🔍 מתחיל לקרוא מ-Firestore...');

        const usersSnapshot = await getDocs(collection(db, 'users'));

        console.log('✅ קריאה הצליחה!');
        console.log('מספר מסמכים:', usersSnapshot.size);

        if (usersSnapshot.empty) {
          statusDiv.className = 'status error';
          statusDiv.innerHTML = '<strong>⚠️ אזהרה:</strong> אין משתמשים במסד הנתונים!';
          resultsDiv.innerHTML = '<h2>האוסף "users" ריק לחלוטין</h2><p>זה אומר שהנתונים נמחקו או שמעולם לא היו משתמשים.</p>';
          return;
        }

        statusDiv.className = 'status success';
        statusDiv.innerHTML = `<strong>✅ הצלחה!</strong> נמצאו ${usersSnapshot.size} מסמכים באוסף users`;

        let tableHTML = '<h2>רשימת משתמשים:</h2>';
        tableHTML += '<table><thead><tr>';
        tableHTML += '<th>ID</th><th>שם</th><th>אימייל</th><th>תפקיד</th><th>סטטוס</th><th>טלפון</th><th>נוצר</th>';
        tableHTML += '</tr></thead><tbody>';

        let adminsCount = 0;
        let usersCount = 0;
        let pendingCount = 0;
        let approvedCount = 0;
        let blockedCount = 0;

        usersSnapshot.forEach((doc) => {
          const data = doc.data();

          if (data.role === 'admin') adminsCount++;
          else usersCount++;

          if (data.status === 'pending') pendingCount++;
          if (data.status === 'approved') approvedCount++;
          if (data.status === 'blocked') blockedCount++;

          const createdAt = data.createdAt
            ? (data.createdAt.toDate ? data.createdAt.toDate().toLocaleString('he-IL') : 'לא זמין')
            : 'לא זמין';

          tableHTML += '<tr>';
          tableHTML += `<td>${doc.id}</td>`;
          tableHTML += `<td>${data.name || '-'}</td>`;
          tableHTML += `<td>${data.email || '-'}</td>`;
          tableHTML += `<td><strong>${data.role || '-'}</strong></td>`;
          tableHTML += `<td>${data.status || '-'}</td>`;
          tableHTML += `<td>${data.phone || '-'}</td>`;
          tableHTML += `<td>${createdAt}</td>`;
          tableHTML += '</tr>';

          console.log('משתמש:', {
            id: doc.id,
            name: data.name,
            email: data.email,
            role: data.role,
            status: data.status
          });
        });

        tableHTML += '</tbody></table>';

        tableHTML += '<h3>סטטיסטיקות:</h3>';
        tableHTML += '<table>';
        tableHTML += `<tr><th>סה"כ משתמשים</th><td>${usersSnapshot.size}</td></tr>`;
        tableHTML += `<tr><th>מנהלים (admins)</th><td>${adminsCount}</td></tr>`;
        tableHTML += `<tr><th>משתמשים רגילים</th><td>${usersCount}</td></tr>`;
        tableHTML += `<tr><th>ממתינים לאישור</th><td>${pendingCount}</td></tr>`;
        tableHTML += `<tr><th>מאושרים</th><td>${approvedCount}</td></tr>`;
        tableHTML += `<tr><th>חסומים</th><td>${blockedCount}</td></tr>`;
        tableHTML += '</table>';

        if (adminsCount > 0 && usersCount === 0) {
          tableHTML += '<div class="status error" style="margin-top: 20px;">';
          tableHTML += '<h3>⚠️ בעיה מזוהה!</h3>';
          tableHTML += '<p>יש רק משתמשי <strong>admin</strong> במסד הנתונים.</p>';
          tableHTML += '<p>הפונקציה <code>getAllUsers()</code> מסננת משתמשי admin, לכן הם לא מופיעים בפאנל הניהול!</p>';
          tableHTML += '</div>';
        }

        resultsDiv.innerHTML = tableHTML;

      } catch (error) {
        console.error('❌ שגיאה:', error);

        statusDiv.className = 'status error';
        statusDiv.innerHTML = '<strong>❌ שגיאה!</strong> לא הצלחנו לקרוא מ-Firestore';

        resultsDiv.innerHTML = `
          <h2>פרטי השגיאה:</h2>
          <pre>${error.message}</pre>
          <h3>קוד שגיאה:</h3>
          <pre>${error.code || 'לא זמין'}</pre>
          <h3>Stack trace:</h3>
          <pre>${error.stack}</pre>
        `;
      }
    };

    // בדיקה אוטומטית בטעינת הדף
    window.addEventListener('load', () => {
      console.log('🚀 דף נטען - מוכן לבדיקה');
    });
  </script>
</body>
</html>
